# Configuration for the reporting-asymmetry study.

# Time window for the whole study. Override per-command with --start/--end.
window:
  start: "2023-10-01"
  end: "2024-06-01"

# ACLED ground-truth pull.
acled:
  countries: ["Israel", "Palestine"]
  # Projectile / strike events. ACLED sub-event types of interest:
  sub_event_types:
    - "Shelling/artillery/missile attack"
    - "Air/drone strike"
  # Keywords used to flag rocket-toward-Israel events in notes (heuristic).
  rocket_keywords: ["rocket", "mortar", "projectile", "barrage", "Iron Dome"]

# Outlets to measure. `gdelt_domains` are matched with GDELT's `domainis:`.
outlets:
  western_legacy:
    - { name: "BBC",            gdelt_domains: ["bbc.com", "bbc.co.uk"] }
    - { name: "New York Times", gdelt_domains: ["nytimes.com"] }
    - { name: "Reuters",        gdelt_domains: ["reuters.com"] }
    - { name: "AP",             gdelt_domains: ["apnews.com"] }
  regional:
    - { name: "Al Jazeera",     gdelt_domains: ["aljazeera.com"] }
    - { name: "Times of Israel",gdelt_domains: ["timesofisrael.com"] }
    - { name: "Haaretz",        gdelt_domains: ["haaretz.com"] }

# Red Alert (Tzeva Adom / Pikud HaOref) siren archive — the most granular free
# signal of incoming fire. See src/ingest/redalert.py. Host blocked under
# "Trusted"; run locally or allowlist tzevaadom.co.il (docs/NETWORK.md).
redalert:
  source_url: "https://www.tzevaadom.co.il/static/historical/all.json"
  # Field names inside each alert record — verify against the sample the
  # ingester prints on first run and adjust if the schema has drifted.
  date_field: "date"          # epoch seconds/ms or ISO string
  category_field: "category"  # threat category (code or label)
  area_field: "area"          # affected locality
  # Keep only these categories. Digit values match the category CODE exactly;
  # text values match as a case-insensitive substring. Empty list = keep all.
  # Category 1 is rocket/missile fire; label variants included for robustness.
  rocket_categories: ["1", "rocket", "missile", "טיל", "רקטות"]

# Coverage-matching: how long after an event do we count articles as "covering" it.
coverage:
  window_days: 3
  # GDELT query applied alongside the domain filter.
  base_query: "(israel OR gaza OR palestin) (rocket OR strike OR killed OR airstrike)"

# LLM judge for framing analysis (src/analysis/framing_llm.py). More accurate
# than the regex heuristic at resolving who-acted-on-whom in a headline.
judge:
  # Sonnet 4.6 balances accuracy and cost; switch to claude-haiku-4-5 to go cheaper.
  model: "claude-sonnet-4-6"
  # Headlines classified per API call. Larger = fewer calls; keep within output budget.
  batch_size: 20

# Side labels used throughout. `actor1` patterns infer who launched the event.
sides:
  toward_israel:
    actor_patterns: ["Hamas", "Islamic Jihad", "PIJ", "Hezbollah", "Lions' Den",
                     "Al-Qassam", "Al-Quds", "Palestinian Militia", "Houthi"]
    location_in: ["Israel"]
  toward_palestine:
    actor_patterns: ["Military Forces of Israel", "Police Forces of Israel",
                     "Israel (2022-)", "Settlers"]
    location_in: ["Palestine"]
